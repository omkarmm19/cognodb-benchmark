services:
  # 1. Memgraph (In-memory C++ engine capped to 0.5 vCPU and 512MB RAM for fairness)
  memgraph:
    image: memgraph/memgraph:latest
    container_name: benchmark-memgraph
    ports:
      - "7688:7687"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  # 2. FalkorDB (GraphBLAS sparse matrix engine capped to 0.5 vCPU and 512MB RAM for fairness)
  falkordb:
    image: falkordb/falkordb:latest
    container_name: benchmark-falkordb
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
